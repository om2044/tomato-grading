version: '3.9'

services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ../backend
    env_file: ../.env
    depends_on: [db]
    volumes:
      - ../ai/models/saved:/app/models/saved:ro
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    build: ../frontend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [frontend, backend]
    restart: always

volumes:
  postgres_data:
