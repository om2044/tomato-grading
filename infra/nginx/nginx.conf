server {
    listen 80;
    server_name _;

    # Frontend React
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
    }

    # Backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 10M;  # pour les images de tomates
    }

    # Swagger docs (développement)
    location /docs {
        proxy_pass http://backend:8000/docs;
    }
}
